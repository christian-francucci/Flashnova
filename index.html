<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLASH NOVA</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

* {
    font-family: 'Orbitron', sans-serif;
    box-sizing: border-box;
}

body {
    margin: 0;
    color: white;
    overflow-x: hidden;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* INTRO */
.intro {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 9999;
    animation: fadeOut 4s forwards 4.5s;
}

.intro img {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(280px, 70vw);
    animation: blink 1.2s infinite, glow 2s infinite;
}

@keyframes blink {
    0%,100%{opacity:1;}
    50%{opacity:0.4;}
}

@keyframes glow {
    0%{filter:drop-shadow(0 0 5px #00ffe1);}
    50%{filter:drop-shadow(0 0 20px #00ffe1);}
    100%{filter:drop-shadow(0 0 5px #00ffe1);}
}

@keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
}

/* FONDO */
.bg-img {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url('fondo.jpg') center/cover no-repeat;
    z-index: -3;
}

.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -2;
}

/* TITULOS */
.center {
    text-align: center;
    margin-bottom: 20px;
}

/* FILAS */
.row {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

/* ITEMS */
.item {
    width: 300px;
}

/* 🔥 FIX IMÁGENES */
.item img,
.item video {
    width: 100%;
    height: auto; /* 🔥 clave */
    border-radius: 10px;
}

/* HOVER */
.item:hover img,
.item:hover video {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00ffe1;
}

/* RADIO */
.radio {
    text-align: center;
    margin-top: 40px;
}

.radio button {
    padding: 12px 20px;
    border-radius: 25px;
    background: #00ffe1;
    border: none;
    cursor: pointer;
}

/* CONTACTO */
.contact {
    text-align: center;
    margin-top: 40px;
}

/* WHATSAPP */
.whatsapp-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    color: white;
    padding: 15px;
    border-radius: 50px;
    text-decoration: none;
}

/* MOBILE */
@media (max-width: 768px) {
    .item {
        width: 90%;
    }
}

</style>
</head>

<body>

<div class="intro">
<img src="logo.png">
</div>

<div class="bg-img"></div>
<div class="overlay"></div>

<div class="container">

<h2 class="center">SI NO VENDE NO ES CREATIVO</h2>
<p class="center">Creamos ideas que se convierten en clientes.</p>

<h2 class="center">TRABAJOS</h2>

<div class="row">
    <div class="item"><img src="foto1.jpg"></div>
    <div class="item"><img src="foto2.jpg"></div>
    <div class="item"><img src="foto3.jpg"></div>
</div>

<div class="row">
    <div class="item"><img src="foto4.jpg"></div>
    <div class="item"><img src="foto5.jpg"></div>
    <div class="item"><img src="foto6.jpg"></div>
</div>

<div class="row">
    <div class="item"><video controls><source src="video.mp4"></video></div>
    <div class="item"><video controls><source src="video2.mp4"></video></div>
    <div class="item"><video controls><source src="video3.mp4"></video></div>
</div>

<section class="radio">
<h2>RADIOACTIVA</h2>
<button onclick="toggleRadio()">▶ ESCUCHAR</button>

<div id="radioBox" style="display:none;">
<iframe src="https://www.raddios.com/12626-radio-online-infovillegas-fm-905-general-villegas-argentina" width="100%" height="200"></iframe>
</div>
</section>

<section class="contact">
<h2>CONTACTO</h2>
<p>📞 +54 9 3388 529085</p>
<p>📧 christianfrancucci@gmail.com</p>
<p>Respondemos en el día</p>
</section>

</div>

<a href="https://api.whatsapp.com/send?phone=5493388529085" class="whatsapp-btn">
🚀 Pedí tu propuesta
</a>

<audio id="musica" loop>
<source src="musica.mp3">
</audio>

<script>

const musica=document.getElementById("musica");

document.addEventListener("click",()=>musica.play(),{once:true});

let radio=false;

function toggleRadio(){
let box=document.getElementById("radioBox");

if(!radio){
box.style.display="block";
musica.pause();
radio=true;
}else{
box.style.display="none";
musica.play();
radio=false;
}
}

const videos=document.querySelectorAll("video");

videos.forEach(v=>{
v.addEventListener("play",()=>musica.pause());
v.addEventListener("pause",()=>musica.play());
});

</script>

</body>
</html>
