/* TIPOGRAFÍA GLOBAL */
* {
    font-family: 'Orbitron', sans-serif;
}

body {
    margin: 0;
    color: white;
    overflow-x: hidden;
}

/* CONTENEDOR */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* 🎬 INTRO MEJORADA */
.intro {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    animation: fadeOut 4s forwards 3s;
}

.intro img {
    width: 300px;
    animation: cinematic 3s ease;
}

@keyframes cinematic {
    0% { transform: scale(1.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
}

/* FONDO */
.bg-img {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url('fondo.jpg') center/cover no-repeat;
    filter: brightness(0.5) contrast(1.3);
    z-index: -3;
}

.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -2;
}

/* PARTICULAS */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* LOGO */
.logo-header {
    text-align: center;
    margin-top: 30px;
}

.logo {
    width: 500px;
    max-width: 90%;
}

/* CENTRADO */
.center {
    text-align: center;
    margin-bottom: 20px;
}

/* ESCANEO */
.scan {
    position: relative;
    display: inline-block;
}

.scan::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    left: -100%;
    background: linear-gradient(120deg, transparent, rgba(0,255,225,0.5), transparent);
    animation: scan 3s infinite;
}

@keyframes scan {
    100% { left: 100%; }
}

/* FILAS */
.row {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

/* ✨ IMÁGENES PRO */
.item {
    width: 300px;
    transition: 0.4s;
}

.item img,
.item video {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    transition: 0.4s;
}

/* 🔥 HOVER GLOW */
.item:hover img,
.item:hover video {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00ffe1;
}

/* RADIO */
.radio {

    margin-top: 40px;

.radio button {

    border-radius: 25px;
    background: #00ffe1;

/* CONTACTO */

.whatsapp-btn:hover {

/* RESPONSIVE */
@media (max-width: 900px) {

<script>

/* 🎧 FADE AUDIO */
const musica = document.getElementById("musica");

function fadeIn(audio){
    audio.volume = 0;
    audio.play();
    let vol = 0;
    let interval = setInterval(()=>{
        if(vol < 1){
            vol += 0.05;
            audio.volume = vol;
        } else clearInterval(interval);
    },100);
}

function fadeOut(audio){
    let vol = audio.volume;
    let interval = setInterval(()=>{
        if(vol > 0){
            vol -= 0.05;
            audio.volume = vol;
        } else {
            audio.pause();
            clearInterval(interval);
        }
    },100);
}

document.addEventListener("click", () => {
    fadeIn(musica);
}, { once:true });

/* RADIO */
let radioActiva=false;
function toggleRadio(){
    const box=document.getElementById("radioBox");

    if(!radioActiva){
        box.style.display="block";
        fadeOut(musica);
        radioActiva=true;
    } else {
        box.style.display="none";
        fadeIn(musica);
        radioActiva=false;
    }
}

/* PARTICULAS */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles=[];
for(let i=0;i<50;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
dx:(Math.random()-0.5),
dy:(Math.random()-0.5)
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
p.x+=p.dx;
p.y+=p.dy;

ctx.beginPath();
ctx.arc(p.x,p.y,2,0,Math.PI*2);
ctx.fillStyle="#00ffe1";
ctx.fill();
});

requestAnimationFrame(draw);
}
draw();

</script>
